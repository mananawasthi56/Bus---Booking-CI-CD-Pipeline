
name: BusGo CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    env:
      APP_NAME: Bus Booking Platform
      DATABASE_URL: postgresql://busgo:busgo_password@localhost:5432/busbooking
      SECRET_KEY: github-actions-test-secret

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: busgo
          POSTGRES_PASSWORD: busgo_password
          POSTGRES_DB: busbooking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U busgo -d busbooking"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: pytest -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t busgo-backend:latest .
