
name: BusGo CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    env:
      APP_NAME: Bus Booking Platform
      DATABASE_URL: postgresql://busgo:busgo_password@localhost:5432/busbooking
      SECRET_KEY: github-actions-test-secret

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: busgo
          POSTGRES_PASSWORD: busgo_password
          POSTGRES_DB: busbooking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U busgo -d busbooking"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: pytest -v

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/busgo-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/busgo-backend:${{ github.sha }}
