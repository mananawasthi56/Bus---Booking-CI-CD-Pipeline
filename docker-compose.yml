
services:
  db:
    image: postgres:18
    container_name: busgo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: busbooking
      POSTGRES_USER: busgo
      POSTGRES_PASSWORD: busgo_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busgo -d busbooking"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: mananawasthi/busgo-backend:${IMAGE_TAG:-latest}
    build:
      context: .
    container_name: busgo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Bus Booking Platform
      DATABASE_URL: postgresql://busgo:busgo_password@db:5432/busbooking
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
