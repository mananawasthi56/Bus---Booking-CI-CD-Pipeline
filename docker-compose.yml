
services:
  db:
    image: postgres:18
    container_name: busgo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: busbooking
      POSTGRES_USER: busgo
      POSTGRES_PASSWORD: busgo_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busgo -d busbooking"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: busgo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Bus Booking Platform
      DATABASE_URL: postgresql://busgo:busgo_password@db:5432/busbooking
      SECRET_KEY: change-this-to-a-long-random-secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
